version: '3.8'

services:
  crewgraph-ai:
    build: .
    container_name: crewgraph-ai
    ports:
      - "7860:7860"
    volumes:
      # Persistent storage for memory and cache
      - chroma_data:/app/chroma_db
      - gradio_cache:/app/.gradio
      - app_cache:/app/cache
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

volumes:
  chroma_data:
    driver: local
  gradio_cache:
    driver: local
  app_cache:
    driver: local
